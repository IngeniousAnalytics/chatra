name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify copyright, logo, and brand attribution integrity
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f BRAND_POLICY.md
          test -f web/chatra-logo.svg
          test -f web/favicon.svg
          test -f web/ingenious-logo.png
          grep -q "IngeniousAnalytics.com" web/index.html
          grep -q "Powered by" web/index.html

      - name: Run automated API test suite
        run: python -m pytest tests/test_api.py -v
