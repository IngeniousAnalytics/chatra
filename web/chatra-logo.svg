<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Luminous pearl-glass light canvas -->
    <linearGradient id="chatraLightBg" x1="32" y1="16" x2="480" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <!-- Subtle diagonal specular sheen -->
    <linearGradient id="chatraSheen" x1="0" y1="0" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e0f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Crisp outer rim -->
    <linearGradient id="chatraRim" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <!-- Faceted Chatra 'C' speech-ribbon gradient -->
    <linearGradient id="chatraRibbonMain" x1="104" y1="104" x2="368" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Inner folded ribbon highlight -->
    <linearGradient id="chatraRibbonFold" x1="116" y1="260" x2="292" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <!-- Data-prism core gradient -->
    <linearGradient id="chatraPrism" x1="256" y1="184" x2="388" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Light squircle base -->
  <rect width="512" height="512" rx="124" fill="url(#chatraLightBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="118" stroke="url(#chatraRim)" stroke-width="6"/>

  <!-- Subtle architectural grid / orbital halo -->
  <circle cx="272" cy="256" r="168" stroke="#0ea5e9" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="10 14"/>
  <path d="M40 160C40 82 82 40 160 40H352C260 110 140 210 40 280V160Z" fill="url(#chatraSheen)"/>

  <!-- Origami-folded 'C' conversational ribbon with crisp speech notch -->
  <path d="M342 152C315 127 279 112 240 112C158.262 112 92 178.262 92 260C92 301.2 108.9 338.5 136.2 365.4L110 414L178.5 391.5C197.8 400.8 218.4 406 240 406C282.5 406 320.8 388.1 347.8 359.4" stroke="url(#chatraRibbonMain)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Secondary inner ribbon fold for depth -->
  <path d="M138 320C156 352 192 376 238 376" stroke="url(#chatraRibbonFold)" stroke-width="14" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Relational Data Constellation + Faceted Prism (AI + RDBMS synthesis) -->
  <path d="M270 256L334 198M270 256L334 314M334 198L382 256L334 314" stroke="#4f46e5" stroke-opacity="0.32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Faceted diamond prism node -->
  <path d="M270 218L304 256L270 294L236 256Z" fill="url(#chatraPrism)"/>
  <path d="M270 218L304 256L270 256Z" fill="#ffffff" fill-opacity="0.32"/>

  <!-- Connected schema nodes -->
  <circle cx="334" cy="198" r="15" fill="#0ea5e9" stroke="#ffffff" stroke-width="5"/>
  <circle cx="382" cy="256" r="17" fill="#10b981" stroke="#ffffff" stroke-width="5"/>
  <circle cx="334" cy="314" r="15" fill="#6366f1" stroke="#ffffff" stroke-width="5"/>
</svg>
